<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>褐飞虱照片复核</title>
<style>body{margin:0;background:#f5f6f8;color:#233340;font:15px system-ui,sans-serif}header,nav,aside{padding:12px 20px;background:white;border-bottom:1px solid #ddd}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;padding:7px 10px;border:1px solid #bac6d0;border-radius:5px;background:white}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}#save{background:#31566d;color:white}#info{line-height:1.7}#stage{overflow:auto;height:64vh;padding:15px}canvas{display:block;margin:0 auto;background:#eee;cursor:crosshair;box-shadow:0 1px 5px #aaa}small{color:#586a75}.status{font-weight:600}.left{color:#2677A8}.right{color:#D86C32}#notice{color:#935921}label{display:inline-flex;gap:6px;align-items:center}#notes{width:28vw}#index{width:75px}</style>
<header><h1>褐飞虱照片复核</h1><small>原图只读 · 自动框仅供核对 · 保存为追加记录</small></header>
<nav><select id="group"><option value="A">ZH11 B3-OE</option><option value="B">BPH33</option><option value="C">BPH33回补</option></select><button id="prev">上一张</button><input id="index" type="number" min="1" value="1"><button id="go">跳转</button><button id="next">下一张</button><span id="position"></span><label>显示比例<select id="zoom"><option value="fit">全图</option><option value="0.32">32%</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">原始像素</option></select></label></nav>
<aside><div id="info">正在读取照片……</div><div id="notice">BPH33及回补组未通过计数验收；请同时检查漏检、重复、重叠及株上归属。箱壁、底部、飞行和倒影不能混入左右株上计数。</div></aside>
<nav><label>新增框类别<select id="kind"><option value="left">左侧株上</option><option value="right">右侧株上</option><option value="other">其他位置</option><option value="suspect">无法确认</option></select></label><button id="delete">删除选中框</button><button id="undo">撤销</button><button id="reset">恢复自动框</button><label><input id="showOther" type="checkbox">显示其他和疑似框</label><span id="counts" class="status"></span><small>点选已有框后删除；在空白处拖动新增框。可放大查看。</small></nav>
<div id="stage"><canvas id="canvas"></canvas></div>
<nav><input id="reviewer" placeholder="复核者姓名"><input id="notes" placeholder="重叠、归属或其他说明"><label><input id="confirmed" type="checkbox">已核对整张照片的候选框及漏检</label><button id="save">保存本张复核</button><span id="status" role="status"></span></nav>
<script>
'use strict';
const $=s=>document.getElementById(s),canvas=$('canvas'),ctx=canvas.getContext('2d');
let current=null,img=new Image(),boxes=[],original=[],history=[],selected=-1,drag=null,scale=.32,loading=false;
const colors={left:'#2677A8',right:'#D86C32',other:'#8b5fbf',suspect:'#c83939'};
function backup(){history.push(structuredClone(boxes));if(history.length>30)history.shift();$('confirmed').checked=false;}
function draw(){if(!img.naturalWidth)return;scale=$('zoom').value==='fit'?Math.min(($('stage').clientWidth-30)/4416,($('stage').clientHeight-30)/2488):Number($('zoom').value);canvas.width=Math.round(4416*scale);canvas.height=Math.round(2488*scale);ctx.drawImage(img,0,0,canvas.width,canvas.height);ctx.font='12px system-ui';boxes.forEach((b,i)=>{if(!['left','right'].includes(b.kind)&&!$('showOther').checked)return;const [x,y,w,h]=b.bbox.map(v=>v*scale);ctx.strokeStyle=colors[b.kind];ctx.lineWidth=i===selected?3:1.5;ctx.strokeRect(x,y,w,h);ctx.fillStyle=colors[b.kind];ctx.fillText(String(i+1),x,y-3);});if(drag){ctx.strokeStyle=colors[$('kind').value];ctx.lineWidth=2;ctx.strokeRect(drag.x*scale,drag.y*scale,(drag.ex-drag.x)*scale,(drag.ey-drag.y)*scale);}const count=k=>boxes.filter(b=>b.kind===k).length;$('counts').textContent=`左 ${count('left')}  ·  右 ${count('right')}  ·  其他 ${count('other')}  ·  归属待定 ${count('suspect')}`;}
async function load(i=0){if(loading)return;if(history.length&&!confirm('本张标注修改尚未保存。放弃修改并切换照片？'))return;loading=true;$('status').textContent='正在读取原图……';$('save').disabled=true;try{const resp=await fetch(`/api/frame?group=${encodeURIComponent($('group').value)}&index=${i}`);const d=await resp.json();if(!resp.ok)throw Error(d.error);current=d;$('index').value=d.index+1;$('position').textContent=`共 ${d.total.toLocaleString()} 张`;$('prev').disabled=d.index===0;$('next').disabled=d.index===d.total-1;const r=d.row;$('info').textContent=`${r.frame_id} ｜ ${r.timestamp} ｜ ${r.review_status} ｜ ${r.quality_reason||'画面质量初筛通过'} ｜ 主计数：${r.left_count||'待确认'} / ${r.right_count||'待确认'} ｜ 算法复核标记 ${r.suspect_count} 个`;original=d.detections.map(b=>({bbox:b.bbox,kind:b.side||(b.zone==='reflection_or_bottom'?'suspect':'other'),origin:'automatic',original_detection_id:b.detection_id}));boxes=d.review?structuredClone(d.review.boxes):structuredClone(original);history=[];selected=-1;$('confirmed').checked=false;$('notes').value=d.review?.notes||'';if(d.review){$('reviewer').value=d.review.reviewer;$('info').textContent+=' ｜ 已有复核：'+d.review.reviewer;}await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('原图加载失败，请检查原始卷'));img.src='/image?frame_id='+encodeURIComponent(r.frame_id);});draw();$('status').textContent='';$('save').disabled=false;}catch(e){$('status').textContent=e.message;}finally{loading=false;}}
function point(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(4415,(e.clientX-r.left)/scale)),y:Math.max(0,Math.min(2487,(e.clientY-r.top)/scale))};}
canvas.addEventListener('pointerdown',e=>{const p=point(e);selected=boxes.findIndex(b=>(['left','right'].includes(b.kind)||$('showOther').checked)&&p.x>=b.bbox[0]&&p.x<=b.bbox[0]+b.bbox[2]&&p.y>=b.bbox[1]&&p.y<=b.bbox[1]+b.bbox[3]);if(selected<0){drag={x:p.x,y:p.y,ex:p.x,ey:p.y};canvas.setPointerCapture(e.pointerId);}draw();});
canvas.addEventListener('pointermove',e=>{if(drag){const p=point(e);drag.ex=p.x;drag.ey=p.y;draw();}});
canvas.addEventListener('pointerup',()=>{if(!drag)return;const x=Math.min(drag.x,drag.ex),y=Math.min(drag.y,drag.ey),w=Math.abs(drag.ex-drag.x),h=Math.abs(drag.ey-drag.y);if(w>5&&h>5){backup();boxes.push({bbox:[x,y,w,h],kind:$('kind').value,origin:'review_added'});selected=boxes.length-1;}drag=null;draw();});
$('delete').onclick=()=>{if(selected>=0){backup();boxes.splice(selected,1);selected=-1;draw();}};$('undo').onclick=()=>{if(history.length){boxes=history.pop();selected=-1;$('confirmed').checked=false;draw();}};$('reset').onclick=()=>{backup();boxes=structuredClone(original);selected=-1;draw();};
$('zoom').onchange=draw;$('showOther').onchange=draw;$('group').onchange=()=>load(0);$('prev').onclick=()=>load(current.index-1);$('next').onclick=()=>load(current.index+1);$('go').onclick=()=>load(Number($('index').value)-1);$('index').onkeydown=e=>{if(e.key==='Enter')$('go').click();};
$('save').onclick=async()=>{if(!current)return;$('status').textContent='';try{const resp=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({frame_id:current.row.frame_id,reviewer:$('reviewer').value,notes:$('notes').value,confirmed:$('confirmed').checked,boxes})});const d=await resp.json();if(!resp.ok)throw Error(d.error);$('status').textContent=d.message;history=[];}catch(e){$('status').textContent=e.message;}};
window.addEventListener('resize',draw);
load(0);
</script></html>
